name: ROS2 CI

on: [pull_request, push]

jobs:
  test_docker: # On Linux, iterates on all ROS 1 and ROS 2 distributions.
      runs-on: ubuntu-latest
      strategy:
        matrix:
          ros_distribution:
            # - noetic
            # - foxy
            # - galactic
            - humble
            - iron
            - jazzy
            - rolling

          # Define the Docker image(s) associated with each ROS distribution.
          # The include syntax allows additional variables to be defined, like
          # docker_image in this case. See documentation:
          # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#example-including-configurations-in-a-matrix-build
          #
          # Platforms are defined in REP 3 and REP 2000:
          # https://ros.org/reps/rep-0003.html
          # https://ros.org/reps/rep-2000.html
          include:
            # Noetic Ninjemys (May 2020 - May 2025)
            # - docker_image: ubuntu:focal
            #   ros_distribution: noetic
            #   ros_version: 1

            # Foxy Fitzroy (June 2020 - June 2023)
            # - docker_image: ubuntu:focal # 20.04
            #  ros_distribution: foxy
            #  ros_version: 2

            # Galactic Geochelone (May 2021 - Dec 2022)
            # - docker_image: ubuntu:focal # 20.04
            #  ros_distribution: galactic
            #  ros_version: 2

            # Humble Hawksbill (May 2022 - May 2027)
            - docker_image: rostooling/setup-ros-docker:ubuntu-jammy-ros-humble-ros-base-latest # 22.04
              ros_distribution: humble
              ros_version: 2

            # Iron Irwini (May 2023 - November 2024)
            - docker_image: rostooling/setup-ros-docker:ubuntu-jammy-ros-iron-ros-base-latest # 22.04
              ros_distribution: iron
              ros_version: 2

            # Jazzy Jalisco (May 2024 - May 2029)
            # - docker_image: rostooling/setup-ros-docker:ubuntu-noble-ros-jazzy-ros-base-latest # 24.04
            #   ros_distribution: jazzy
            #   ros_version: 2

            # Rolling Ridley (No End-Of-Life)
            # - docker_image: rostooling/setup-ros-docker:ubuntu-noble-ros-rolling-ros-base-latest # 24.04
            #   ros_distribution: rolling
            #   ros_version: 2
      container:
        image: ${{ matrix.docker_image }}
      steps:
        - name: setup directories
          run: mkdir -p ros_ws/src
        - name: checkout
          uses: actions/checkout@v4
          with:
            path: ros_ws/src
        - name: build and test ROS 2
          if: ${{ matrix.ros_version == 2 }}
          uses: ros-tooling/action-ros-ci@v0.4
          with:
            package-name: ""
            target-ros2-distro: ${{ matrix.ros_distribution }}
