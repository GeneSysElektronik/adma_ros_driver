name: ROS2 CI

on:
  push:
    branches: [ ros2_dev ]
  pull_request:

jobs:
  build_and_test_ros2:
    name: build_and_test
    runs_on: ubuntu-latest
    container:
      image: rostooling/setup-ros-docker:ubuntu-jammy-latest
    steps:
      - name: Build and run tests
        uses: ros-tooling/action-ros-ci@0.7
        with:
          package-name: ""
          target-ros2-distro: humble

